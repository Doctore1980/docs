  <script>
    (function () {
      var ID = "04-nota-al-pie";
      var $ = function (s) { return document.getElementById(ID + "-" + s); };
      var rootEl = document.querySelector('[data-composition-id="' + ID + '"]');
      var stage = $("stage");

      var words = rootEl.querySelectorAll('[class~="04-nota-al-pie-w"]');
      var sup = $("sup");
      var rule = $("rule-line");
      var marker = $("marker");
      var fly = $("fly");
      var refText = $("reftext");
      var closeLine = $("close");

      // Build the reference line as per-character spans (type-on target).
      var REF = "EAU Guidelines on Prostate Cancer, 2026 · §5.2.2";
      var chars = [];
      for (var i = 0; i < REF.length; i++) {
        var c = document.createElement("span");
        c.textContent = REF.charAt(i);
        c.style.opacity = "0";
        refText.appendChild(c);
        chars.push(c);
      }

      // Layout offsets measured against the stage (transform-independent).
      function offsetIn(el) {
        var x = 0, y = 0, n = el;
        while (n && n !== stage) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
        return { x: x, y: y };
      }
      // Fly's resting place = the marker slot in the reference line.
      function restXY() {
        var m = offsetIn(marker);
        return m;
      }
      // Start = on top of the sentence superscript (scaled up to match its size).
      var START_SCALE = 1.62;
      function startDX() { var s = offsetIn(sup); var r = restXY(); return s.x - r.x + 2; }
      function startDY() { var s = offsetIn(sup); var r = restXY(); return s.y - r.y - 6; }

      var tl = gsap.timeline({ paused: true });

      // Place the flying marker on its resting slot (left/top), animate via x/y only.
      tl.set(fly, {
        left: function () { return restXY().x; },
        top: function () { return restXY().y; },
        opacity: 0
      }, 0);

      // Scene 1 (0.0–2.0s): per-word staggered reveal, power3, reading-paced.
      var WORD_START = 0.15, WORD_STAGGER = 0.2;
      for (var w = 0; w < words.length; w++) {
        tl.fromTo(words[w],
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          WORD_START + w * WORD_STAGGER);
      }

      // Scene 2 (2.0–2.8s): superscript appears in coral with a small scale pulse.
      tl.fromTo(sup, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.25, duration: 0.28, ease: "power3.out" }, 2.0);
      tl.to(sup, { scale: 1, duration: 0.4, ease: "power2.inOut" }, 2.28);

      // Scene 3 (2.8–4.8s): the ¹ travels down and OPENS into the reference line.
      tl.fromTo(fly,
        { opacity: 0, x: startDX, y: startDY, scale: START_SCALE },
        { opacity: 1, duration: 0.12, ease: "none" }, 2.8);
      tl.to(fly, { x: 0, y: 0, scale: 1, duration: 0.55, ease: "power3.inOut" }, 2.84);
      // Hairline self-draws left→right from the landed marker.
      tl.fromTo(rule, { attr: { "stroke-dashoffset": 1360 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.1, ease: "power2.out" }, 3.3);
      // Reference types on, character by character (seek-safe discrete sets).
      var TYPE_START = 3.42, TYPE_STEP = 0.026;
      for (var k = 0; k < chars.length; k++) {
        tl.set(chars[k], { opacity: 1 }, TYPE_START + k * TYPE_STEP);
      }

      // Scene 4 (4.8–7.0s): closing lead enters, then everything holds still.
      tl.fromTo(closeLine, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 4.85);

      // Anchor the timeline to the full 7s frame duration.
      tl.set({}, {}, 7);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
