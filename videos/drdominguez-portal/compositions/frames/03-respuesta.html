<template id="03-respuesta-template">
  <div
    id="root"
    data-composition-id="03-respuesta"
    data-start="0"
    data-duration="6"
    data-width="1920"
    data-height="1080"
  >
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url("assets/fonts/captured-IBMPlexSans-normal-400-600-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url("assets/fonts/captured-IBMPlexSans-normal-400-600-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        container-type: size;
        font-family: "IBM Plex Sans", sans-serif;
        color: #0e2240;
      }

      /* full-bleed cream ground (clip layer, not on #root) */
      .f03-respuesta-bg {
        position: absolute;
        inset: 0;
        background: #faf8f4;
      }

      /* ── Scene 1: the noise cluster (handoff_in from F2) ── */
      .f03-respuesta-noise {
        position: absolute;
        inset: 0;
      }
      .f03-respuesta-ncard {
        position: absolute;
        width: 300px;
        height: 118px;
        padding: 18px 20px;
        background: #faf8f4;
        border: 1px solid rgba(14, 34, 64, 0.12);
        border-radius: 8px;
        box-shadow: 0 1px 3px rgba(14, 34, 64, 0.08), 0 4px 16px rgba(14, 34, 64, 0.04);
        transform-origin: 50% 50%;
      }
      .f03-respuesta-ncard i {
        display: block;
        width: 88px;
        height: 8px;
        margin-bottom: 12px;
        border-radius: 4px;
        background: rgba(14, 34, 64, 0.1);
      }
      .f03-respuesta-ncard b {
        display: block;
        font-weight: 500;
        font-size: 21px;
        line-height: 1.25;
        color: rgba(14, 34, 64, 0.58);
      }
      .f03-respuesta-ncard.is-far b {
        color: rgba(14, 34, 64, 0.34);
      }
      .f03-respuesta-ncard.is-far {
        filter: blur(1.4px);
      }

      .f03-respuesta-bar {
        position: absolute;
        left: 580px;
        top: 392px;
        width: 760px;
        height: 76px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 30px;
        background: #faf8f4;
        border: 1px solid rgba(14, 34, 64, 0.2);
        border-radius: 9999px;
        box-shadow: 0 1px 3px rgba(14, 34, 64, 0.08), 0 4px 16px rgba(14, 34, 64, 0.04);
        transform-origin: 50% 50%;
      }
      .f03-respuesta-bar svg {
        width: 28px;
        height: 28px;
        flex: none;
      }
      .f03-respuesta-bar span {
        font-size: 28px;
        font-weight: 400;
        color: #0e2240;
      }

      .f03-respuesta-dot {
        position: absolute;
        left: 952px;
        top: 422px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #0e2240;
        z-index: 3;
      }

      /* ── Scenes 2–3: the real PSA section, inside a nested camera ── */
      .f03-respuesta-cam-outer {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      .f03-respuesta-cam-inner {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      /* ~70% width, centred on the handoff point (960, 430) */
      .f03-respuesta-card {
        position: absolute;
        left: 288px;
        top: 52px;
        width: 1344px;
        height: 756px;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid rgba(14, 34, 64, 0.12);
        box-shadow: 0 1px 3px rgba(14, 34, 64, 0.08), 0 4px 16px rgba(14, 34, 64, 0.04);
        background: #faf8f4;
        transform-origin: 50% 50%;
      }
      .f03-respuesta-card img {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 50% 50%;
      }
    </style>

    <div class="f03-respuesta-bg clip" data-start="0" data-duration="6" data-track-index="0"></div>

    <div class="f03-respuesta-noise clip" data-start="0" data-duration="1.6" data-track-index="1">
      <div class="f03-respuesta-ncard is-far" data-cx="250" data-cy="250" style="left:100px;top:191px"><i></i><b>Remedios naturales para bajar el PSA</b></div>
      <div class="f03-respuesta-ncard" data-cx="560" data-cy="250" style="left:410px;top:191px"><i></i><b>¿PSA alto = cáncer?</b></div>
      <div class="f03-respuesta-ncard" data-cx="965" data-cy="215" style="left:815px;top:156px"><i></i><b>Lo que nadie te cuenta del PSA</b></div>
      <div class="f03-respuesta-ncard" data-cx="1370" data-cy="250" style="left:1220px;top:191px"><i></i><b>PSA elevado: señales que no debes ignorar</b></div>
      <div class="f03-respuesta-ncard is-far" data-cx="1670" data-cy="250" style="left:1520px;top:191px"><i></i><b>Foro: ¿alguien más con el PSA alto?</b></div>
      <div class="f03-respuesta-ncard" data-cx="330" data-cy="420" style="left:180px;top:361px"><i></i><b>Mi PSA subió, ¿qué hago?</b></div>
      <div class="f03-respuesta-ncard" data-cx="1590" data-cy="430" style="left:1440px;top:371px"><i></i><b>¿Biopsia ya?</b></div>
      <div class="f03-respuesta-ncard is-far" data-cx="560" data-cy="615" style="left:410px;top:556px"><i></i><b>PSA y próstata: guía rápida</b></div>
      <div class="f03-respuesta-ncard" data-cx="965" data-cy="650" style="left:815px;top:591px"><i></i><b>PSA alto: lo que debes saber hoy</b></div>
      <div class="f03-respuesta-ncard is-far" data-cx="1370" data-cy="612" style="left:1220px;top:553px"><i></i><b>Causas del PSA alto que te asustarán</b></div>

      <div class="f03-respuesta-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0E2240" stroke-width="1.8" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <line x1="15.5" y1="15.5" x2="21" y2="21" />
        </svg>
        <span>psa alto</span>
      </div>
      <div class="f03-respuesta-dot"></div>
    </div>

    <div class="f03-respuesta-cam-outer clip" data-start="0" data-duration="6" data-track-index="2">
      <div class="f03-respuesta-cam-inner">
        <div class="f03-respuesta-card">
          <img src="assets/scroll-019.png" alt="Sección PSA de la web: ¿Te han dicho que tienes el PSA alto?" />
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="03-respuesta"]');
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };

        var HX = 960, HY = 430; // handoff centre (cluster + bar)
        var tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.4s): collapse — cards implode into one point ──
        var cards = qa(".f03-respuesta-ncard");
        cards.forEach(function (el) {
          var cx = parseFloat(el.getAttribute("data-cx"));
          var cy = parseFloat(el.getAttribute("data-cy"));
          var d = Math.sqrt((cx - HX) * (cx - HX) + (cy - HY) * (cy - HY));
          var start = 0.3 - Math.min(d, 760) / 760 * 0.3; // outer ring commits first
          tl.fromTo(
            el,
            { x: 0, y: 0, scale: 1, opacity: 1 },
            { x: HX - cx, y: HY - cy, scale: 0.1, opacity: 0, duration: 0.95, ease: "power3.in" },
            start
          );
        });
        tl.fromTo(
          q(".f03-respuesta-bar"),
          { scale: 1, opacity: 1 },
          { scale: 0.03, opacity: 0, duration: 1.0, ease: "power3.in" },
          0.25
        );
        tl.fromTo(
          q(".f03-respuesta-dot"),
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
          1.0
        );
        tl.to(q(".f03-respuesta-dot"), { scale: 3, opacity: 0, duration: 0.25, ease: "power2.out" }, 1.42);

        // ── Scene 2 (1.4–3.2s): the real PSA card expands out of the point ──
        var card = q(".f03-respuesta-card");
        tl.fromTo(card, { scale: 0.02 }, { scale: 1, duration: 1.05, ease: "power3.out" }, 1.4);
        tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 1.4);
        tl.fromTo(q(".f03-respuesta-card img"), { scale: 1.06 }, { scale: 1, duration: 1.6, ease: "power2.out" }, 1.4);

        // ── Scene 3 (3.2–6.0s): slow push-in onto heading + first line, then still ──
        // Target (heading + first paragraph) sits at screenshot (960, 320) → canvas (960, 276)
        // at rest, i.e. offset (0, -264) from canvas centre. Land it at y ≈ 440 (upper 83%):
        // S·(offset + T) = -100  →  T = -100/S + 264.
        var S = 2.0;
        var T = -100 / S + 264; // 214
        var ZOOM_AT = 3.2, ZOOM_DUR = 2.3;
        tl.fromTo(q(".f03-respuesta-cam-outer"), { scale: 1 }, { scale: S, duration: ZOOM_DUR, ease: "power2.inOut" }, ZOOM_AT);
        tl.fromTo(q(".f03-respuesta-cam-inner"), { x: 0, y: 0 }, { x: 0, y: T, duration: ZOOM_DUR, ease: "power2.inOut" }, ZOOM_AT);

        // hold still on the line until 6.0s
        tl.set({}, {}, 6);

        window.__timelines = window.__timelines || {};
        window.__timelines["03-respuesta"] = tl;
      })();
    </script>
  </div>
</template>
