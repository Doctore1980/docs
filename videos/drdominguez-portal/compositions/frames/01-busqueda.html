  <script>
    (function () {
      var FRAME_ID = "01-busqueda";
      var DUR = 4.5;
      window.__timelines = window.__timelines || {};

      var bar = document.getElementById("01-busqueda-bar");
      var cam = document.getElementById("01-busqueda-cam");
      var textEl = document.getElementById("01-busqueda-text");
      var caretEl = document.getElementById("01-busqueda-caret");

      // Discrete text sequence — human, irregular keystroke schedule.
      // Scene 2 (0.6–2.4s): type "psa alto es cancer" with word-break hesitations.
      // Scene 3 (2.4–3.4s): backspace "alto es cancer", retype "6 es cáncer?".
      var SEQ = [{ t: 0, text: "" }];
      var keys = [];
      function typeRun(base, str, times) {
        for (var i = 0; i < str.length; i++) {
          base += str[i];
          SEQ.push({ t: times[i], text: base });
          keys.push(times[i]);
        }
        return base;
      }
      var s = typeRun("", "psa alto es cancer",
        [0.62, 0.71, 0.78, 0.90, 1.12, 1.20, 1.27, 1.36, 1.46, 1.60, 1.68, 1.80, 1.95, 2.03, 2.10, 2.19, 2.26, 2.33]);
      // held backspace: peel "alto es cancer" (14 chars) back to "psa "
      var bt = 2.48;
      for (var b = 0; b < 14; b++) {
        s = s.slice(0, -1);
        SEQ.push({ t: bt, text: s });
        keys.push(bt);
        bt += 0.022;
      }
      typeRun(s, "6 es cáncer?",
        [2.84, 2.90, 2.96, 3.01, 3.07, 3.12, 3.19, 3.23, 3.27, 3.31, 3.35, 3.40]);

      function textAt(t) {
        for (var i = SEQ.length - 1; i >= 0; i--) if (t >= SEQ[i].t) return SEQ[i].text;
        return "";
      }
      function lastKeyBefore(t) {
        var k = -1;
        for (var i = 0; i < keys.length; i++) if (keys[i] <= t) k = keys[i];
        return k;
      }
      // Caret: solid while keys are being struck, square-wave blink (1.0s period) when idle.
      function caretOn(t) {
        var k = lastKeyBefore(t);
        if (k >= 0 && t - k < 0.45) return true;
        var idle = k >= 0 ? t - (k + 0.45) : t;
        return Math.sin(idle * Math.PI * 2 + Math.PI / 2) > -0.2;
      }

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.6s): bar slides up into place on empty cream.
      tl.fromTo(bar,
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: true },
        0);

      // Text + caret driver for the whole shot (seek-safe: state derived from time only).
      var drv = { t: 0 };
      tl.fromTo(drv, { t: 0 }, {
        t: DUR,
        duration: DUR,
        ease: "none",
        immediateRender: true,
        onUpdate: function () {
          textEl.textContent = textAt(drv.t);
          caretEl.style.opacity = caretOn(drv.t) ? "1" : "0";
        }
      }, 0);

      // Scene 4 (3.4–4.5s): quiet hold, very slow camera push-in toward the bar.

      window.__timelines[FRAME_ID] = tl;
